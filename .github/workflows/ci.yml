name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only need to read the repository.
permissions:
  contents: read

# A new push to a branch or pull request cancels its runs that are still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # bash on every runner (Git Bash on Windows), so steps behave the same.
    shell: bash

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Let every combination finish, so one failure does not hide others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Quoted: unquoted, YAML would read 3.10 as the number 3.1.
        # Keep in step with the classifiers in pyproject.toml
        # (tests/test_packaging.py checks this).
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install hashident with test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run the tests
        run: python -m pytest

      - name: Smoke test the hashident command
        run: |
          hashident --version

          # Check exit codes ourselves, so a failure says what was expected.
          set +e
          hashident 8743b52063cd84097a65d1633f5c74f5 > "$RUNNER_TEMP/md5.txt"
          md5_status=$?
          hashident not-a-hash > /dev/null
          no_match_status=$?
          set -e

          cat "$RUNNER_TEMP/md5.txt"
          if [ "$md5_status" -ne 0 ]; then
            echo "::error::hashident on the MD5 example exited with $md5_status, expected 0"
            exit 1
          fi
          if ! grep -q "^1  MD5 " "$RUNNER_TEMP/md5.txt"; then
            echo "::error::MD5 is not the top candidate for the MD5 example"
            exit 1
          fi
          if [ "$no_match_status" -ne 1 ]; then
            echo "::error::hashident on a non-hash exited with $no_match_status, expected 1"
            exit 1
          fi

  build:
    name: Build and check the package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: python -m pip install build twine

      # Builds the sdist, then the wheel from that sdist, so a file missing
      # from the sdist breaks the wheel build here rather than for users.
      - name: Build the sdist and wheel
        run: python -m build

      - name: Check the package metadata and README for PyPI
        run: python -m twine check --strict dist/*

      - name: Install the wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl

      # Run from outside the checkout, so nothing can be imported from src/.
      - name: Smoke test the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          export PATH="$RUNNER_TEMP/wheel-env/bin:$PATH"
          python -c "import hashident; print('imported from', hashident.__file__)"
          python -c "import hashident; assert 'site-packages' in hashident.__file__"
          hashident --version

          set +e
          hashident 8743b52063cd84097a65d1633f5c74f5 > md5.txt
          status=$?
          set -e

          cat md5.txt
          if [ "$status" -ne 0 ]; then
            echo "::error::the installed wheel exited with $status on the MD5 example, expected 0"
            exit 1
          fi
          if ! grep -q "^1  MD5 " md5.txt; then
            echo "::error::the installed wheel did not rank MD5 first for the MD5 example"
            exit 1
          fi

      - name: Upload the built packages
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
