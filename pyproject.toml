[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hashident"
dynamic = ["version"]
description = "Identify likely hash algorithms from a hash string."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Mendoza" }]
# The Python versions listed here must match the CI test matrix in
# .github/workflows/ci.yml (tests/test_packaging.py checks this).
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jmendoza167/hash_identifier"
Issues = "https://github.com/jmendoza167/hash_identifier/issues"
Changelog = "https://github.com/jmendoza167/hash_identifier/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
hashident = "hashident.cli:main"

[tool.setuptools.dynamic]
version = { attr = "hashident.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
